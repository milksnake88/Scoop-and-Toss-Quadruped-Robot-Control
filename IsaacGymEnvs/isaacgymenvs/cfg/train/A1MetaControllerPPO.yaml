params:
  seed: ${...seed}

  algo:
    name: a2c_discrete_moe_two_actions

  experts:
    expert1:
      name: 'a1_run_test46'
      checkpoint: '/home/mj/IsaacGym/IsaacGymEnvs/isaacgymenvs/runs/a1_run_test49/nn/a1_run_test49.pth'
      config: '/home/mj/IsaacGym/IsaacGymEnvs/isaacgymenvs/runs/a1_run_test49/config.yaml'
    expert2:
      name: 'pi_pick_throw_test36'
      checkpoint: '/home/mj/IsaacGym/IsaacGymEnvs/isaacgymenvs/runs/pi_pick_throw_test70_STI/nn/pi_pick_throw_test70_STI.pth'
      config: '/home/mj/IsaacGym/IsaacGymEnvs/isaacgymenvs/runs/pi_pick_throw_test70_STI/config.yaml'
    env_info:
      actions_num: 12
      agent: 1
      value_size: 1
    model:
      name: continuous_a2c_logstd


  model:
    name: discrete_a2c 
    
  network:
    name: gating_network_two_actions 
    separate: False

    space:
      discrete:
      #continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0. # std = 1.
        fixed_sigma: True

    mlp:
      units: [256, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False} # flag which sets whether to load the checkpoint
  load_path: ${...checkpoint} # path to the checkpoint to load

  config:
    name: ${resolve_default:A1,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 1.
    tau: 0.95
    e_clip: 0.2
    entropy_coef: 0.02
    learning_rate: 7.e-5 # overwritten by adaptive lr_schedule
    lr_schedule: adaptive
    kl_threshold: 0.01 # target kl for adaptive lr
    truncate_grads: True
    grad_norm: 2.
    horizon_length: 48
    minibatch_size: 4096
    mini_epochs: 5
    critic_coef: 2
    clip_value: True
    clip_actions: False
    seq_len: 4 # only for rnn
    bounds_loss_coef: 0.001

    max_epochs: 80000
    save_best_after: 100
    score_to_win: 1000000
    save_frequency: 100
    print_stats: True
